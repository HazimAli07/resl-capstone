name: Hazim model checks
on:
  push:
    branches: ["hazim/**"]
  pull_request:
    paths:
      - "resl/hazim_*.py"
      - "tests/test_hazim_work.py"
      - "requirements-model.txt"
      - ".github/workflows/hazim-model.yml"
jobs:
  model-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-model.txt
            requirements-demo.txt
      - run: python -m pip install -r requirements-model.txt -r requirements-demo.txt
      - run: python -m resl.hazim_training --synthetic
      - run: python -m unittest discover -s tests -v
      - run: python -m resl.mannan_demo
